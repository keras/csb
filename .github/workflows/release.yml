name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build csb-host-run (linux/amd64 and linux/arm64)
        run: make build-client

      - name: Build csb for all platforms
        run: make dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/csb-*
