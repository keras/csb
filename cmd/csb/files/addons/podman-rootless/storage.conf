# graphroot is overridden to the user's home by rootless podman itself, so
# images persist across runs via the csb-home volume. fuse-overlayfs is
# required because overlay-on-overlay is rejected for unprivileged users.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
