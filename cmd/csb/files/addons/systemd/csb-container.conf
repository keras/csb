[Manager]
# Suppress the "[  OK  ] Finished ..." boot status lines. systemd writes those
# to /dev/console, which is the user's pty under `-t`, so they would otherwise
# bleed into the interactive session (and tmux). Logs still go to the journal —
# use `journalctl` inside the sandbox to see them.
ShowStatus=no
# Route systemd's own log messages (e.g. unit warnings) to the journal instead
# of the console. In a container the default target is the console — i.e. the
# user's pty — so warnings would otherwise leak into the session. Read them with
# `journalctl` inside the sandbox.
LogTarget=journal
# Don't wait forever on jobs when running headless in a container.
DefaultTimeoutStartSec=30s
DefaultTimeoutStopSec=15s
