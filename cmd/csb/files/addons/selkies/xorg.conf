Section "Device"
    Identifier "dummy"
    Driver "dummy"
    # Sized for the Virtual below at 32bpp (5120*2880*4 = 59M). A HiDPI
    # client doubles the resolution it asks for, so 4K-sized VideoRam ran
    # out at ordinary window sizes: the mode switch failed with BadMatch on
    # RRSetScreenSize and left the display with NO current mode at all.
    # Costs nothing when unused — the driver allocates per mode, not up
    # front (measured: identical Xorg RSS at both sizes).
    VideoRam 131072
EndSection
Section "Monitor"
    Identifier "monitor"
    HorizSync 5.0 - 1000.0
    VertRefresh 5.0 - 200.0
EndSection
Section "Screen"
    Identifier "screen"
    Device "dummy"
    Monitor "monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 5120 2880
    EndSubSection
EndSection
