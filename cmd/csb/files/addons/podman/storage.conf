# Rootful podman stores images under $HOME — the persistent csb-home volume,
# a real filesystem (ext4) — rather than its default /var/lib/containers on the
# container's ephemeral rootfs. Because the graphroot is NOT on the container's
# own overlay mount, native kernel overlay works directly and is used (no
# mount_program). fuse-overlayfs is deliberately avoided: it produces a rootfs
# whose binaries fail to exec ("execve: Invalid argument") on some kernels
# (observed on 6.10 aarch64). Native overlay needs root + CAP_SYS_ADMIN, which
# the privileged rootful container provides.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/home/sandbox/.local/share/containers/storage-rootful"
