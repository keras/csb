[containers]
# Docker bind-mounts /proc/sys read-only so crun cannot set sysctls.
default_sysctls = []
# Share the outer PID namespace so crun does not have to mount a fresh /proc
# inside a nested namespace (which Docker's masked-/proc protection blocks).
# This requires cgroups to stay enabled — "cgroups = disabled" forces a private
# PID namespace — which is fine because the privileged container (see the
# --privileged run-arg) gives a writable, delegated cgroup tree.
pidns = "host"
# Pin container logs to the file driver rather than letting podman pick its
# default. That default is journald *when journald is reachable*, i.e. exactly
# when the systemd addon is also enabled — and journald logs combined with the
# file events backend below is a combination podman refuses: following a
# container's logs fails with "using --follow with the journald --log-driver
# but without the journald --events-backend (file) is not supported". That
# breaks any API client that streams output back, which is the norm — the
# docker SDK's containers.run() and `docker-compose up` both follow logs. The
# file driver is consistent with events_logger below and behaves the same with
# or without systemd.
log_driver = "k8s-file"

[engine]
# Manage cgroups directly rather than via systemd, which is absent from the
# single-process sandbox.
cgroup_manager = "cgroupfs"
# journald (the default events backend) is also unavailable without systemd, so
# record container events to a file instead.
events_logger = "file"
