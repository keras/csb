# Publish the Podman API at the Docker default path as well, so Docker-API
# clients handed no configuration find it: docker.from_env(), testcontainers,
# and the docker CLI all fall back to unix:///var/run/docker.sock (/var/run is
# a symlink to /run here) when DOCKER_HOST is unset.
#
# Installed only when the addon is enabled as `podman docker-sock` — claiming
# /var/run/docker.sock is a container-wide assertion that podman *is* the
# Docker daemon, which is a decision for the person running the sandbox, not a
# default. Nothing else in the image provides that path today, but a real
# Docker daemon added later would collide with it.
#
# Created from the socket unit rather than written to disk at startup, so the
# link exists only while the API is genuinely listening and a client can never
# connect through it to nothing. The symlink carries no permissions of its own;
# access is governed by the socket and its directory (see entrypoint.sh).
[Socket]
ExecStartPost=/bin/ln -sfn %t/podman/podman.sock %t/docker.sock
ExecStopPost=-/bin/rm -f %t/docker.sock
